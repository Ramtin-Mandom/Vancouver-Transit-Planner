[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vancouver-transit-planner"
version = "1.0.0"
description = "A reliability-aware transit planner for Metro Vancouver GTFS data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "Vancouver Transit Planner contributors" }]
dependencies = [
  "fastapi>=0.115,<0.117",
  "gtfs-realtime-bindings>=1.0,<2",
  "httpx>=0.27,<0.29",
  "numpy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "uvicorn[standard]>=0.30,<0.36",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.12,<0.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = [
  "integration: tests that require a populated PostgreSQL GTFS database",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

